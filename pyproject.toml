[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcost"
version = "0.2.0"
description = "Local LLM token and query-cost tracker for Codex, Claude Code, and Cline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "textual>=0.80",
    "textual-plotext>=0.2",
]

[project.scripts]
lcost = "lcost.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lcost*"]

[tool.setuptools.package-data]
lcost = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
