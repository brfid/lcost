[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lcost"
version = "0.2.2"
description = "Local LLM token and query-cost tracker for Codex, Claude Code, and Cline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "textual>=0.80",
    "textual-plotext>=0.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lcost = "lcost.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lcost*"]

[tool.setuptools.package-data]
lcost = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
